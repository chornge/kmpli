name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The released version comes from the pushed tag, but gradle/libs.versions.toml
  # declares it too and it is compiled into the binary as KMPLI_VERSION. Fail here
  # rather than after burning four build runners if the two disagree. The condition
  # sits on the step, not the job, so a workflow_dispatch run (which has no tag)
  # does not cascade-skip build-binaries, which needs this job.
  verify-version:
    name: Verify version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Must run from a tag, and the tag must match appVersion
        run: |
          # Fails closed rather than skipping. A workflow_dispatch from a branch used to skip
          # this step, succeed the job, and let create-release publish a release literally named
          # "refs/heads/main", then auto-merge a manifest PR with that as the version. Dispatch
          # from a tag ref is still fine and is the supported way to re-run a failed release.
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "::error::release.yml must run from a tag, not $GITHUB_REF"
              exit 1
              ;;
          esac

          DECLARED=$(sed -nE 's/^appVersion[[:space:]]*=[[:space:]]*"(.*)"/\1/p' gradle/libs.versions.toml)

          if [ -z "$DECLARED" ]; then
            echo "::error::appVersion not found in gradle/libs.versions.toml"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "$DECLARED" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match appVersion $DECLARED in gradle/libs.versions.toml -- bump it and retag"
            exit 1
          fi

          echo "tag $GITHUB_REF_NAME matches appVersion $DECLARED"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: MacosX64
            binary_name: kmpli-macos-x64
            binary_path: composeApp/build/bin/macosX64/releaseExecutable/kmpli.kexe

          - os: macos-latest
            target: MacosArm64
            binary_name: kmpli-macos-arm64
            binary_path: composeApp/build/bin/macosArm64/releaseExecutable/kmpli.kexe

          - os: ubuntu-24.04
            target: LinuxX64
            binary_name: kmpli-linux-x64
            binary_path: composeApp/build/bin/linuxX64/releaseExecutable/kmpli.kexe

          # Cross-compiled from the x86_64 runner: Kotlin/Native publishes no
          # linux-aarch64 host compiler, so aarch64 cannot be built natively.
          - os: ubuntu-24.04
            target: LinuxArm64
            binary_name: kmpli-linux-arm64
            binary_path: composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe

          - os: windows-latest
            target: MingwX64
            binary_name: kmpli-windows-x64.exe
            binary_path: composeApp/build/bin/mingwX64/releaseExecutable/kmpli.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ matrix.target }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-gradle-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ matrix.target }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-konan-

      - name: Mac Dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew list openssl &>/dev/null || brew install openssl
          brew list curl &>/dev/null || brew install curl

      - name: Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      # Kept identical to .github/workflows/build.yml; see the comments there.
      - name: Linux arm64 Cross Dependencies
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          codename=$(lsb_release -cs)

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          if [ -s /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb \(http\)|deb [arch=amd64] \1|' /etc/apt/sources.list
          fi

          sudo dpkg --add-architecture arm64

          # Every suite the amd64 side has must be mirrored for arm64. Packages such as
          # libcurl4t64 are Multi-Arch: same, which requires identical versions across
          # architectures, so if arm64 cannot see a suite that amd64 can, the two drift and
          # install fails with "not going to be installed". That is exactly what happened when
          # noble-security published 8.5.0-2ubuntu10.16 while this list only reached
          # noble-updates at 10.15.
          for suite in "$codename" "$codename-updates" "$codename-security" "$codename-backports"; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $suite main restricted universe multiverse"
          done | sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null

          sudo apt-get update

          # --force-overwrite: the amd64 and arm64 dev packages both ship /usr/bin/curl-config
          # with per-architecture contents, so dpkg refuses the overwrite. This job only ever
          # builds aarch64, so letting the arm64 copy win is safe.
          #
          # The -dev packages matter beyond libcurl itself: they provide the unversioned
          # libfoo.so symlinks the linker resolves -lfoo against. The runtime packages only
          # ship libfoo.so.N.
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" \
            libcurl4-openssl-dev:arm64 \
            libssl-dev:arm64 \
            zlib1g-dev:arm64 \
            libnghttp2-dev:arm64 \
            librtmp-dev:arm64 \
            libssh-dev:arm64 \
            libpsl-dev:arm64 \
            libkrb5-dev:arm64 \
            libldap-dev:arm64 \
            libbrotli-dev:arm64 \
            libzstd-dev:arm64 \
            libgcc-14-dev:arm64

          echo "--- linker symlinks available for -l resolution ---"
          ls -1 /usr/lib/aarch64-linux-gnu/*.so 2>/dev/null \
            | grep -E 'lib(curl|ssl|crypto|nghttp2|rtmp|ssh|psl|gssapi|krb5|z|brotli|zstd)' || true

          echo "--- libcurl.so must exist or -lcurl cannot resolve ---"
          test -e /usr/lib/aarch64-linux-gnu/libcurl.so \
            || { echo "::error::arm64 libcurl.so missing"; exit 1; }

          # Kotlin/Native's aarch64 toolchain is GCC 8.3.0, which predates outline atomics and
          # so cannot supply __aarch64_swp4_acq, referenced by Ubuntu's GCC 14-built libcurl.
          # Those helpers live only in the static libgcc.a: libgcc_s.so.1 exports no
          # __aarch64_* symbols at all, so -lgcc_s cannot resolve them.
          find /usr/lib/gcc/aarch64-linux-gnu -name libgcc.a | sed 's/^/  libgcc.a: /'

      - name: Resolve arm64 libcurl Link Closure
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          # LIBDIR rather than just PATH, so the amd64 .pc files in
          # /usr/lib/x86_64-linux-gnu/pkgconfig cannot be picked up by mistake.
          # /usr/share/pkgconfig stays on the list for arch-independent .pc files that
          # libcurl's Requires.private may resolve to.
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

          opts=$(pkg-config --libs --static libcurl)
          echo "libcurl static closure: $opts"

          test -n "$opts" || { echo "::error::pkg-config returned no libs for arm64 libcurl"; exit 1; }

          # Static libgcc for the outline-atomics helpers, passed by ABSOLUTE PATH rather
          # than -lgcc. Kotlin ships its own libgcc.a (GCC 8.3.0, which predates outline
          # atomics) and its directory sits ahead of ours on the search path, so -lgcc
          # silently resolves to that one and the symbol stays undefined. Naming the
          # archive directly bypasses -l resolution.
          libgcc_a=$(find /usr/lib/gcc/aarch64-linux-gnu -name libgcc.a | head -1)
          test -f "$libgcc_a" || { echo "::error::arm64 libgcc.a not found"; exit 1; }

          # Guard against picking an archive that lacks the helpers we need.
          strings "$libgcc_a" | grep -q '__aarch64_swp4_acq' \
            || { echo "::error::$libgcc_a has no outline-atomics helpers"; exit 1; }

          opts="$opts $libgcc_a"

          echo "final arm64 linker opts: $opts"
          echo "KMPLI_LINUX_ARM64_LINKER_OPTS=$opts" >> "$GITHUB_ENV"

      - name: Windows Dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install -y --no-progress curl openssl.light 2>$null
          try { choco install -y --no-progress winlibs 2>$null } catch { }

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew compileKotlin${{ matrix.target }} linkReleaseExecutable${{ matrix.target }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_path }}
          retention-days: 1

  create-release:
    name: Create Release
    needs: build-binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Prepare Release Assets
        run: |
          mkdir -p release

          # Copy and rename binaries
          cp release-binaries/kmpli-macos-x64/kmpli.kexe release/kmpli-macos-x64
          cp release-binaries/kmpli-macos-arm64/kmpli.kexe release/kmpli-macos-arm64
          cp release-binaries/kmpli-linux-x64/kmpli.kexe release/kmpli-linux-x64
          cp release-binaries/kmpli-linux-arm64/kmpli.kexe release/kmpli-linux-arm64
          cp release-binaries/kmpli-windows-x64.exe/kmpli.exe release/kmpli-windows-x64.exe

          chmod +x release/kmpli-*

          # Compute SHA256 hashes
          echo "SHA_MACOS_X64=$(sha256sum release/kmpli-macos-x64 | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "SHA_MACOS_ARM64=$(sha256sum release/kmpli-macos-arm64 | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "SHA_LINUX_X64=$(sha256sum release/kmpli-linux-x64 | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "SHA_LINUX_ARM64=$(sha256sum release/kmpli-linux-arm64 | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "SHA_WINDOWS_X64=$(sha256sum release/kmpli-windows-x64.exe | cut -d ' ' -f 1)" >> $GITHUB_ENV

          # Create source archive
          VERSION=${GITHUB_REF/refs\/tags\//}
          echo "RELEASE_NAME=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NUMBER=${VERSION#v}" >> $GITHUB_ENV

          zip -r "release/kmpli-source.zip" . \
            -x ".DS_Store" \
               ".git/*" \
               ".github/*" \
               ".gradle/*" \
               ".idea/*" \
               ".kotlin/*" \
               "build/*" \
               "composeApp/build/*" \
               "release/*" \
               "release-binaries/*"

      - name: Generate Changelog
        run: |
          # Get all commits from the previous tag to this tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${GITHUB_REF}^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            # --invert-grep drops "Update package manifests for vX.Y.Z". That commit is
            # created by the PREVIOUS release's own workflow, so it always lands after
            # that release's tag and would otherwise be reported under this one.
            RELEASE_NOTES=$(git log ${PREV_TAG}..${GITHUB_REF} --pretty=format:"- %s" \
              --invert-grep --grep="^Update package manifests")
            if [ -z "$RELEASE_NOTES" ]; then
              RELEASE_NOTES="- No user-facing changes; see CHANGELOG.md"
            fi
          else
            RELEASE_NOTES="Initial release"
          fi

          # Add download instructions
          cat >> release-notes.md << EOF
          ## Installation

          ### Quick Install (Recommended)

          **macOS/Linux:**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/chornge/kmpli/main/install.sh | bash
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/chornge/kmpli/main/install.ps1 | iex
          \`\`\`

          The installer will set up the launcher script. The appropriate binary for your platform will be automatically downloaded on first run.

          ### Package Managers

          **Homebrew (macOS/Linux):**
          \`\`\`bash
          brew tap chornge/kmpli https://github.com/chornge/kmpli && brew install kmpli
          \`\`\`

          **Scoop (Windows):**
          \`\`\`powershell
          scoop bucket add kmpli https://github.com/chornge/kmpli && scoop install kmpli
          \`\`\`

          ### Manual Download

          Download the appropriate binary for your platform:
          - **macOS (Apple Silicon)**: \`kmpli-macos-arm64\`
          - **macOS (Intel)**: \`kmpli-macos-x64\`
          - **Linux (x64)**: \`kmpli-linux-x64\`
          - **Linux (ARM64)**: \`kmpli-linux-arm64\`
          - **Windows (x64)**: \`kmpli-windows-x64.exe\`
          - **Source**: \`kmpli-source.zip\`

          Make it executable and move to your PATH.

          ## Changes

          $RELEASE_NOTES
          EOF

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          cat release-notes.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            release/kmpli-macos-x64
            release/kmpli-macos-arm64
            release/kmpli-linux-x64
            release/kmpli-linux-arm64
            release/kmpli-windows-x64.exe
            release/kmpli-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        run: |
          cat > Formula/kmpli.rb << EOF
          class Kmpli < Formula
            desc "CLI tool for generating Kotlin Multiplatform projects"
            homepage "https://github.com/chornge/kmpli"
            version "${VERSION_NUMBER}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/chornge/kmpli/releases/download/${RELEASE_NAME}/kmpli-macos-arm64"
                sha256 "${SHA_MACOS_ARM64}"
              else
                url "https://github.com/chornge/kmpli/releases/download/${RELEASE_NAME}/kmpli-macos-x64"
                sha256 "${SHA_MACOS_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/chornge/kmpli/releases/download/${RELEASE_NAME}/kmpli-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/chornge/kmpli/releases/download/${RELEASE_NAME}/kmpli-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              binary_name = stable.url.split("/").last
              bin.install binary_name => "kmpli"
            end

            test do
              assert_match "Usage:", shell_output("#{bin}/kmpli --help")
            end
          end
          EOF

      - name: Update Scoop Manifest
        run: |
          cat > bucket/kmpli.json << EOF
          {
            "version": "${VERSION_NUMBER}",
            "description": "CLI tool for generating Kotlin Multiplatform projects",
            "homepage": "https://github.com/chornge/kmpli",
            "license": "Apache-2.0",
            "architecture": {
              "64bit": {
                "url": "https://github.com/chornge/kmpli/releases/download/${RELEASE_NAME}/kmpli-windows-x64.exe",
                "hash": "${SHA_WINDOWS_X64}"
              }
            },
            "bin": [
              ["kmpli-windows-x64.exe", "kmpli"]
            ],
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/chornge/kmpli/releases/download/v\$version/kmpli-windows-x64.exe"
                }
              }
            }
          }
          EOF

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          BRANCH_NAME="update-manifests-${RELEASE_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add Formula/kmpli.rb bucket/kmpli.json
          git commit -m "Update package manifests for ${RELEASE_NAME}"
          git push https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/chornge/kmpli.git "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "Update package manifests for ${RELEASE_NAME}" \
            --body "Automated PR to update Homebrew formula and Scoop manifest for release ${RELEASE_NAME}.

          **SHA256 Checksums:**
          - macOS ARM64: \`${SHA_MACOS_ARM64}\`
          - macOS x64: \`${SHA_MACOS_X64}\`
          - Linux x64: \`${SHA_LINUX_X64}\`
          - Linux ARM64: \`${SHA_LINUX_ARM64}\`
          - Windows x64: \`${SHA_WINDOWS_X64}\`

          🤖 Generated by release workflow" \
            --base main \
            --head "$BRANCH_NAME")

          # Merge immediately with admin bypass (required checks don't run for manifest-only PRs)
          gh pr merge "$PR_URL" --admin --squash --delete-branch
