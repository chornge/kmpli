name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "Formula/**"
      - "bucket/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Run tests only on Linux
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew allTests

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15-intel
            target: MacosX64
            binary_path: composeApp/build/bin/macosX64/releaseExecutable/kmpli.kexe

          - os: macos-latest
            target: MacosArm64
            binary_path: composeApp/build/bin/macosArm64/releaseExecutable/kmpli.kexe

          - os: ubuntu-24.04
            target: LinuxX64
            binary_path: composeApp/build/bin/linuxX64/releaseExecutable/kmpli.kexe

          # Cross-compiled from the x86_64 runner: Kotlin/Native publishes no
          # linux-aarch64 host compiler, so aarch64 cannot be built natively.
          - os: ubuntu-24.04
            target: LinuxArm64
            binary_path: composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe

          - os: windows-latest
            target: MingwX64
            binary_path: composeApp/build/bin/mingwX64/releaseExecutable/kmpli.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Keyed by target, not just OS. LinuxX64 and LinuxArm64 both report runner.os=Linux
      # but need different content: arm64 klibs and the aarch64 toolchain versus x64 ones.
      # Sharing one key let whichever job saved first win, so the other could restore a
      # cache missing its own dependencies.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ matrix.target }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-gradle-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ matrix.target }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-konan-

      - name: Mac Dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install openssl curl

      - name: Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      # Cross-linking to aarch64 needs arm64 libcurl and its dependencies on an x86_64
      # runner. Ubuntu serves arm64 from ports.ubuntu.com rather than archive.ubuntu.com,
      # so the existing sources must be pinned to amd64 first or apt-get update 404s.
      - name: Linux arm64 Cross Dependencies
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          codename=$(lsb_release -cs)

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          if [ -s /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb \(http\)|deb [arch=amd64] \1|' /etc/apt/sources.list
          fi

          sudo dpkg --add-architecture arm64
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main restricted universe multiverse\n' \
            "$codename" "$codename" | sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null

          sudo apt-get update

          # --force-overwrite: the amd64 and arm64 dev packages both ship /usr/bin/curl-config
          # with per-architecture contents, so dpkg refuses the overwrite. This job only ever
          # builds aarch64, so letting the arm64 copy win is safe.
          #
          # The -dev packages matter beyond libcurl itself: they provide the unversioned
          # libfoo.so symlinks the linker resolves -lfoo against. The runtime packages only
          # ship libfoo.so.N.
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" \
            libcurl4-openssl-dev:arm64 \
            libssl-dev:arm64 \
            zlib1g-dev:arm64 \
            libnghttp2-dev:arm64 \
            librtmp-dev:arm64 \
            libssh-dev:arm64 \
            libpsl-dev:arm64 \
            libkrb5-dev:arm64 \
            libldap-dev:arm64 \
            libbrotli-dev:arm64 \
            libzstd-dev:arm64 \
            libgcc-14-dev:arm64

          echo "--- linker symlinks available for -l resolution ---"
          ls -1 /usr/lib/aarch64-linux-gnu/*.so 2>/dev/null \
            | grep -E 'lib(curl|ssl|crypto|nghttp2|rtmp|ssh|psl|gssapi|krb5|z|brotli|zstd)' || true

          echo "--- libcurl.so must exist or -lcurl cannot resolve ---"
          test -e /usr/lib/aarch64-linux-gnu/libcurl.so \
            || { echo "::error::arm64 libcurl.so missing"; exit 1; }

          # Kotlin/Native's aarch64 toolchain is GCC 8.3.0, which predates outline atomics and
          # so cannot supply __aarch64_swp4_acq, referenced by Ubuntu's GCC 14-built libcurl.
          # Those helpers live only in the static libgcc.a: libgcc_s.so.1 exports no
          # __aarch64_* symbols at all, so -lgcc_s cannot resolve them.
          find /usr/lib/gcc/aarch64-linux-gnu -name libgcc.a | sed 's/^/  libgcc.a: /'

      # --static is required: ktor's klib force-includes a prebuilt static libcurl.a as an
      # explicit linker input, and its members reference libssh, GSSAPI and OpenSSL. Passing
      # only -lcurl leaves those undefined, because the archive is linked ahead of the shared
      # library and wins. The shared libraries this drags in reference a newer glibc than the
      # Kotlin sysroot, which is what --allow-shlib-undefined in build.gradle.kts handles.
      - name: Resolve arm64 libcurl Link Closure
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          # LIBDIR rather than just PATH, so the amd64 .pc files in
          # /usr/lib/x86_64-linux-gnu/pkgconfig cannot be picked up by mistake.
          # /usr/share/pkgconfig stays on the list for arch-independent .pc files that
          # libcurl's Requires.private may resolve to.
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

          opts=$(pkg-config --libs --static libcurl)
          echo "libcurl static closure: $opts"

          test -n "$opts" || { echo "::error::pkg-config returned no libs for arm64 libcurl"; exit 1; }

          # Static libgcc for the outline-atomics helpers, passed by ABSOLUTE PATH rather
          # than -lgcc. Kotlin ships its own libgcc.a (GCC 8.3.0, which predates outline
          # atomics) and its directory sits ahead of ours on the search path, so -lgcc
          # silently resolves to that one and the symbol stays undefined. Naming the
          # archive directly bypasses -l resolution.
          libgcc_a=$(find /usr/lib/gcc/aarch64-linux-gnu -name libgcc.a | head -1)
          test -f "$libgcc_a" || { echo "::error::arm64 libgcc.a not found"; exit 1; }

          # Guard against picking an archive that lacks the helpers we need.
          strings "$libgcc_a" | grep -q '__aarch64_swp4_acq' \
            || { echo "::error::$libgcc_a has no outline-atomics helpers"; exit 1; }

          opts="$opts $libgcc_a"

          echo "final arm64 linker opts: $opts"
          echo "KMPLI_LINUX_ARM64_LINKER_OPTS=$opts" >> "$GITHUB_ENV"

      - name: Windows Dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install -y curl openssl.light
          try { choco install -y winlibs } catch { Write-Host "winlibs not found, continuing..." }

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew compileKotlin${{ matrix.target }} linkReleaseExecutable${{ matrix.target }}

      # The unit tests mock all platform IO, so this is the only coverage anywhere for the
      # real network, TLS, unzip/tar shell-out and placeholder-rewriting path. LinuxArm64 is
      # excluded because its binary cannot execute on the x86_64 builder; it gets its own job.
      - name: Smoke Test
        if: matrix.target != 'LinuxArm64'
        shell: bash
        run: |
          set -eux
          bin="$PWD/${{ matrix.binary_path }}"
          chmod +x "$bin" 2>/dev/null || true

          "$bin" --version
          "$bin" --help | head -3

          # Exercises libcurl and TLS, the unzip/tar shell-out in extractZip, and the
          # placeholder rewriting. Run in a scratch directory: generation writes to cwd.
          rm -rf smoke && mkdir smoke && cd smoke
          "$bin" --name=SmokeTest --pid=org.smoke.test --template=library
          test -d SmokeTest || { echo "::error::generation produced no SmokeTest directory"; exit 1; }
          ls -la

      # Linking can succeed while producing the wrong architecture, so check explicitly.
      - name: Verify aarch64 Binary
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          bin=composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64' || { echo "::error::not an aarch64 binary"; exit 1; }
          echo "--- shared libraries it will need at runtime ---"
          readelf -d "$bin" | grep NEEDED || true

      - name: Upload aarch64 Binary
        if: matrix.target == 'LinuxArm64'
        uses: actions/upload-artifact@v4
        with:
          name: kmpli-linux-arm64
          path: composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe
          if-no-files-found: error

  # GitHub's arm64 Linux runners cannot BUILD kmpli (no linux-aarch64 Kotlin/Native host
  # compiler exists) but they can RUN an aarch64 binary. This is the only way to prove the
  # cross-compiled artifact actually works, rather than merely that it linked. It is kept
  # It gates the branch: the cross-link relies on --allow-shlib-undefined, so a green build
  # alone proves nothing. Only running the binary on real hardware does.
  smoke-test-linux-arm64:
    name: Smoke Test (LinuxArm64)
    needs: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download aarch64 Binary
        uses: actions/download-artifact@v4
        with:
          name: kmpli-linux-arm64

      - name: Run on real aarch64 hardware
        run: |
          set -eux
          uname -m
          chmod +x kmpli.kexe

          ./kmpli.kexe --version
          ./kmpli.kexe --help | head -3

          # Exercises libcurl and TLS, which is the part cross-linking puts at risk.
          ./kmpli.kexe --name="SmokeTest" --pid=org.smoke.test --template=library
          test -d SmokeTest || { echo "::error::generation produced no SmokeTest directory"; exit 1; }
          echo "--- generated ---"
          ls -la

  # Single required status check for the main branch ruleset, which requires the context
  # "build". The matrix job reports one context per target ("Build (LinuxX64)" and so on),
  # so requiring those individually would mean editing the ruleset every time a target is
  # added. This job reports a stable "build" instead.
  #
  # A matrix job's result is "success" only when every leg succeeded, so one gate covers
  # them all. if: always() is required so the gate still runs (and fails) when a dependency
  # fails; without it the job would be skipped and report no useful conclusion.
  build-gate:
    name: build
    needs: [test, build, smoke-test-linux-arm64]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Require test and build to have succeeded
        run: |
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "smoke: ${{ needs.smoke-test-linux-arm64.result }}"

          if [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.smoke-test-linux-arm64.result }}" != "success" ]; then
            echo "::error::build-gate failed: test=${{ needs.test.result }} build=${{ needs.build.result }} smoke=${{ needs.smoke-test-linux-arm64.result }}"
            exit 1
          fi

          echo "All required jobs succeeded"
