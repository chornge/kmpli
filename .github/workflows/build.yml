name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "Formula/**"
      - "bucket/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Run tests only on Linux
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Linux Dependencies
        run: |
          sudo apt-get update
          # zlib1g-dev provides the libz.so symlink that -lz resolves against; ktor's klib
          # declares that -lz itself. libcurl/libssl are no longer linked (ktor bundles its
          # own) but are left here because the runner may build other things against them.
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev

      # Baselined findings in config/detekt-baseline.xml do not fail; new ones do.
      - name: Lint
        run: |
          chmod +x gradlew
          ./gradlew detekt

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew allTests

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15-intel
            target: MacosX64
            binary_path: composeApp/build/bin/macosX64/releaseExecutable/kmpli.kexe

          - os: macos-latest
            target: MacosArm64
            binary_path: composeApp/build/bin/macosArm64/releaseExecutable/kmpli.kexe

          - os: ubuntu-24.04
            target: LinuxX64
            binary_path: composeApp/build/bin/linuxX64/releaseExecutable/kmpli.kexe

          # Cross-compiled from the x86_64 runner: Kotlin/Native publishes no
          # linux-aarch64 host compiler, so aarch64 cannot be built natively.
          - os: ubuntu-24.04
            target: LinuxArm64
            binary_path: composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe

          - os: windows-latest
            target: MingwX64
            binary_path: composeApp/build/bin/mingwX64/releaseExecutable/kmpli.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Keyed by target, not just OS. LinuxX64 and LinuxArm64 both report runner.os=Linux
      # but need different content: arm64 klibs and the aarch64 toolchain versus x64 ones.
      # Sharing one key let whichever job saved first win, so the other could restore a
      # cache missing its own dependencies.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ matrix.target }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-gradle-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ matrix.target }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-konan-

      - name: Mac Dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install openssl curl

      - name: Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # zlib1g-dev provides the libz.so symlink that -lz resolves against; ktor's klib
          # declares that -lz itself. libcurl/libssl are no longer linked (ktor bundles its
          # own) but are left here because the runner may build other things against them.
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev

      # Cross-linking to aarch64 needs arm64 libcurl and its dependencies on an x86_64
      # runner. Ubuntu serves arm64 from ports.ubuntu.com rather than archive.ubuntu.com,
      # so the existing sources must be pinned to amd64 first or apt-get update 404s.
      - name: Linux arm64 Cross Dependencies
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          codename=$(lsb_release -cs)

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          if [ -s /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb \(http\)|deb [arch=amd64] \1|' /etc/apt/sources.list
          fi

          sudo dpkg --add-architecture arm64

          # Every suite the amd64 side has must be mirrored for arm64. Packages such as
          # libcurl4t64 are Multi-Arch: same, which requires identical versions across
          # architectures, so if arm64 cannot see a suite that amd64 can, the two drift and
          # install fails with "not going to be installed". That is exactly what happened when
          # noble-security published 8.5.0-2ubuntu10.16 while this list only reached
          # noble-updates at 10.15.
          for suite in "$codename" "$codename-updates" "$codename-security" "$codename-backports"; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $suite main restricted universe multiverse"
          done | sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null

          sudo apt-get update

          # zlib is the only external library the aarch64 link needs; ktor's klib bundles
          # libcurl, OpenSSL and their closure and asks for -lz itself. See the comment in
          # composeApp/build.gradle.kts. The -dev package rather than the runtime one, because
          # it ships the unversioned libz.so symlink that -lz resolves against; zlib1g alone
          # provides only libz.so.1.
          sudo apt-get install -y zlib1g-dev:arm64

          echo "--- libz.so must exist or -lz cannot resolve ---"
          test -e /usr/lib/aarch64-linux-gnu/libz.so \
            || { echo "::error::arm64 libz.so missing"; exit 1; }

      - name: Windows Dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install -y curl openssl.light
          try { choco install -y winlibs } catch { Write-Host "winlibs not found, continuing..." }

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew compileKotlin${{ matrix.target }} linkReleaseExecutable${{ matrix.target }}

      # The unit tests mock all platform IO, so this is the only coverage anywhere for the
      # real network, TLS, unzip/tar shell-out and placeholder-rewriting path. LinuxArm64 is
      # excluded because its binary cannot execute on the x86_64 builder; it gets its own job.
      - name: Smoke Test
        if: matrix.target != 'LinuxArm64'
        shell: bash
        run: |
          set -eux
          bin="$PWD/${{ matrix.binary_path }}"
          chmod +x "$bin" 2>/dev/null || true

          "$bin" --version
          "$bin" --help | head -3

          # Exercises libcurl and TLS, the unzip/tar shell-out in extractZip, and the
          # placeholder rewriting. Run in a scratch directory: generation writes to cwd.
          rm -rf smoke && mkdir smoke && cd smoke
          "$bin" --name=SmokeTest --pid=org.smoke.test --template=library
          test -d SmokeTest || { echo "::error::generation produced no SmokeTest directory"; exit 1; }
          ls -la

      # --platforms is a materially different path from --template, not just a different URL.
      # kmp.jetbrains.com returns a zip already rooted at the project name, whereas the template
      # repositories return "<repo>-<branch>", so extraction handles the two differently. A
      # regression in exactly that difference shipped in v1.5.0 because only --template was
      # covered here. One platform only, to keep this to a single request per push against a
      # third-party service.
      - name: Smoke Test (platform generation)
        if: matrix.target == 'LinuxX64'
        shell: bash
        run: |
          set -eux
          bin="$PWD/${{ matrix.binary_path }}"
          rm -rf smoke-platforms && mkdir smoke-platforms && cd smoke-platforms

          # ios(swiftui) and server exercise the two branches that differ inside buildUrl:
          # an explicit UI, and a target that emits an engine key rather than a ui key.
          "$bin" --name=SmokePlatforms --pid=org.smoke.platforms \
            --platforms="android,ios(swiftui),server" --include-tests

          test -d SmokePlatforms || { echo "::error::platform generation produced no directory"; exit 1; }
          test -n "$(ls -A SmokePlatforms)" || { echo "::error::generated directory is empty"; exit 1; }
          ls -la SmokePlatforms

          # The Kotlin Toolchain spec is a different shape from the Gradle one, so assert it
          # really produced a declarative project rather than silently falling back to Gradle.
          "$bin" --name=SmokeToolchain --pid=org.smoke.toolchain \
            --platforms="android,ios" --build-system=kotlin

          test -d SmokeToolchain || { echo "::error::toolchain generation produced no directory"; exit 1; }
          find SmokeToolchain -name 'module.yaml' -o -name 'project.yaml' | grep -q . \
            || { echo "::error::no declarative build files; did it fall back to Gradle?"; exit 1; }

      # The runner image carries a broad package set, so every smoke test above can pass with a
      # binary that would not start on a user's machine: whatever it links is already installed
      # here. Running it in debian:stable-slim with only the documented prerequisites present is
      # what actually proves the artifact is self-sufficient. Installing exactly what the README
      # tells people to install also means the two cannot drift apart silently.
      - name: Smoke Test (minimal container)
        if: matrix.target == 'LinuxX64'
        shell: bash
        run: |
          set -eux
          rm -rf smoke-container && mkdir smoke-container
          cp "$PWD/${{ matrix.binary_path }}" smoke-container/kmpli
          chmod +x smoke-container/kmpli

          docker run --rm -v "$PWD/smoke-container:/out" -w /out debian:stable-slim sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl unzip >/dev/null
            ./kmpli --version
            ./kmpli --name=ContainerSmoke --pid=org.container.smoke --platforms=desktop
            test -d ContainerSmoke || { echo "no ContainerSmoke directory"; exit 1; }
          '

      # Linking can succeed while producing the wrong architecture, so check explicitly.
      - name: Verify aarch64 Binary
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          bin=composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64' || { echo "::error::not an aarch64 binary"; exit 1; }
          echo "--- shared libraries it will need at runtime ---"
          readelf -d "$bin" | grep NEEDED || true

          # Regression guard. ktor 3.0.1's bundled libcurl.a was built with SSH, LDAP and RTMP
          # support, so the link needed libcurl's whole closure and every library in it landed
          # in DT_NEEDED. libssh.so.4 is absent on Debian, which satisfies libcurl with libssh2,
          # so the published binary could not start there at all. Nothing in the build should
          # put these back; if one reappears, the link picked up a system libcurl again.
          for forbidden in libssh.so.4 libldap.so.2 librtmp.so.1 libgssapi_krb5.so.2; do
            if readelf -d "$bin" | grep -q "$forbidden"; then
              echo "::error::$forbidden is back in DT_NEEDED; see composeApp/build.gradle.kts"
              exit 1
            fi
          done
          echo "--- no SSH, LDAP, RTMP or GSSAPI dependency, as expected ---"

      - name: Upload aarch64 Binary
        if: matrix.target == 'LinuxArm64'
        uses: actions/upload-artifact@v4
        with:
          name: kmpli-linux-arm64
          path: composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe
          if-no-files-found: error

  # GitHub's arm64 Linux runners cannot BUILD kmpli (no linux-aarch64 Kotlin/Native host
  # compiler exists) but they can RUN an aarch64 binary. This is the only way to prove the
  # cross-compiled artifact actually works, rather than merely that it linked. It is kept
  # It gates the branch: the cross-link relies on --allow-shlib-undefined, so a green build
  # alone proves nothing. Only running the binary on real hardware does.
  smoke-test-linux-arm64:
    name: Smoke Test (LinuxArm64)
    needs: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download aarch64 Binary
        uses: actions/download-artifact@v4
        with:
          name: kmpli-linux-arm64

      - name: Run on real aarch64 hardware
        run: |
          set -eux
          uname -m
          chmod +x kmpli.kexe

          ./kmpli.kexe --version
          ./kmpli.kexe --help | head -3

          # Exercises libcurl and TLS, which is the part cross-linking puts at risk.
          ./kmpli.kexe --name="SmokeTest" --pid=org.smoke.test --template=library
          test -d SmokeTest || { echo "::error::generation produced no SmokeTest directory"; exit 1; }
          echo "--- generated ---"
          ls -la

      # The runner image has libssh, librtmp, libldap and the rest of Ubuntu's libcurl closure
      # preinstalled, so the step above passes even though the binary does not start on a clean
      # system. That is exactly how the libssh.so.4 gap went unnoticed. Docker here is native
      # arm64, so there is no emulation involved.
      - name: Smoke Test (minimal container)
        run: |
          set -eux
          rm -rf smoke-container && mkdir smoke-container
          cp kmpli.kexe smoke-container/kmpli
          chmod +x smoke-container/kmpli

          # --platforms rather than --template on purpose: this check is about whether the
          # binary runs on a clean system, so it should not also depend on the template
          # repositories being reachable. One request, same as the steps above.
          #
          # Nothing beyond the documented prerequisites is installed. ktor 3.0.1's bundled
          # libcurl.a pulled libssh into this binary's DT_NEEDED list, which Debian does not
          # ship, so this step needed a libssh-4 workaround to pass. ktor 3.3.3 drops SSH from
          # that archive, so the workaround is gone. If it ever has to come back, the link got
          # a dependency it should not have.
          docker run --rm -v "$PWD/smoke-container:/out" -w /out debian:stable-slim sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl unzip >/dev/null
            ./kmpli --version
            ./kmpli --name=ContainerSmoke --pid=org.container.smoke --platforms=desktop
            test -d ContainerSmoke || { echo "no ContainerSmoke directory"; exit 1; }
          '

  # Single required status check for the main branch ruleset, which requires the context
  # "build". The matrix job reports one context per target ("Build (LinuxX64)" and so on),
  # so requiring those individually would mean editing the ruleset every time a target is
  # added. This job reports a stable "build" instead.
  #
  # A matrix job's result is "success" only when every leg succeeded, so one gate covers
  # them all. if: always() is required so the gate still runs (and fails) when a dependency
  # fails; without it the job would be skipped and report no useful conclusion.
  build-gate:
    name: build
    needs: [test, build, smoke-test-linux-arm64]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Require test and build to have succeeded
        run: |
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "smoke: ${{ needs.smoke-test-linux-arm64.result }}"

          if [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.smoke-test-linux-arm64.result }}" != "success" ]; then
            echo "::error::build-gate failed: test=${{ needs.test.result }} build=${{ needs.build.result }} smoke=${{ needs.smoke-test-linux-arm64.result }}"
            exit 1
          fi

          echo "All required jobs succeeded"
