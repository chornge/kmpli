name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "Formula/**"
      - "bucket/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Run tests only on Linux
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew allTests

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15-intel
            target: MacosX64

          - os: macos-latest
            target: MacosArm64

          - os: ubuntu-latest
            target: LinuxX64

          # Cross-compiled from the x86_64 runner: Kotlin/Native publishes no
          # linux-aarch64 host compiler, so aarch64 cannot be built natively.
          - os: ubuntu-latest
            target: LinuxArm64

          - os: windows-latest
            target: MingwX64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK-17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Mac Dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install openssl curl

      - name: Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      # Cross-linking to aarch64 needs arm64 libcurl and its dependencies on an x86_64
      # runner. Ubuntu serves arm64 from ports.ubuntu.com rather than archive.ubuntu.com,
      # so the existing sources must be pinned to amd64 first or apt-get update 404s.
      - name: Linux arm64 Cross Dependencies
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          codename=$(lsb_release -cs)

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi

          if [ -s /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb \(http\)|deb [arch=amd64] \1|' /etc/apt/sources.list
          fi

          sudo dpkg --add-architecture arm64
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main restricted universe multiverse\n' \
            "$codename" "$codename" | sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null

          sudo apt-get update

          # --force-overwrite: the amd64 and arm64 dev packages both ship /usr/bin/curl-config
          # with per-architecture contents, so dpkg refuses the overwrite. This job only ever
          # builds aarch64, so letting the arm64 copy win is safe.
          #
          # The -dev packages matter beyond libcurl itself: they provide the unversioned
          # libfoo.so symlinks the linker resolves -lfoo against. The runtime packages only
          # ship libfoo.so.N.
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" \
            libcurl4-openssl-dev:arm64 \
            libssl-dev:arm64 \
            zlib1g-dev:arm64 \
            libnghttp2-dev:arm64 \
            librtmp-dev:arm64 \
            libssh-dev:arm64 \
            libpsl-dev:arm64 \
            libkrb5-dev:arm64 \
            libldap-dev:arm64 \
            libbrotli-dev:arm64 \
            libzstd-dev:arm64

          echo "--- linker symlinks available for -l resolution ---"
          ls -1 /usr/lib/aarch64-linux-gnu/*.so 2>/dev/null \
            | grep -E 'lib(curl|ssl|crypto|nghttp2|rtmp|ssh|psl|gssapi|krb5|z|brotli|zstd)' || true

          echo "--- libcurl.so must exist or -lcurl cannot resolve ---"
          test -e /usr/lib/aarch64-linux-gnu/libcurl.so \
            || { echo "::error::arm64 libcurl.so missing"; exit 1; }

      - name: Windows Dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install -y curl openssl.light
          try { choco install -y winlibs } catch { Write-Host "winlibs not found, continuing..." }

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew compileKotlin${{ matrix.target }} linkReleaseExecutable${{ matrix.target }}

      # Linking can succeed while producing the wrong architecture, so check explicitly.
      - name: Verify aarch64 Binary
        if: matrix.target == 'LinuxArm64'
        run: |
          set -eux
          bin=composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64' || { echo "::error::not an aarch64 binary"; exit 1; }
          echo "--- shared libraries it will need at runtime ---"
          readelf -d "$bin" | grep NEEDED || true

      - name: Upload aarch64 Binary
        if: matrix.target == 'LinuxArm64'
        uses: actions/upload-artifact@v4
        with:
          name: kmpli-linux-arm64
          path: composeApp/build/bin/linuxArm64/releaseExecutable/kmpli.kexe
          if-no-files-found: error

  # GitHub's arm64 Linux runners cannot BUILD kmpli (no linux-aarch64 Kotlin/Native host
  # compiler exists) but they can RUN an aarch64 binary. This is the only way to prove the
  # cross-compiled artifact actually works, rather than merely that it linked. It is kept
  # out of build-gate for now so a runner-availability problem does not block the branch.
  smoke-test-linux-arm64:
    name: Smoke Test (LinuxArm64)
    needs: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download aarch64 Binary
        uses: actions/download-artifact@v4
        with:
          name: kmpli-linux-arm64

      - name: Run on real aarch64 hardware
        run: |
          set -eux
          uname -m
          chmod +x kmpli.kexe

          ./kmpli.kexe --version
          ./kmpli.kexe --help | head -3

          # Exercises libcurl and TLS, which is the part cross-linking puts at risk.
          ./kmpli.kexe --name="SmokeTest" --pid=org.smoke.test --template=library
          echo "--- generated ---"
          ls -la

  # Single required status check for the main branch ruleset, which requires the context
  # "build". The matrix job reports one context per target ("Build (LinuxX64)" and so on),
  # so requiring those individually would mean editing the ruleset every time a target is
  # added. This job reports a stable "build" instead.
  #
  # A matrix job's result is "success" only when every leg succeeded, so one gate covers
  # them all. if: always() is required so the gate still runs (and fails) when a dependency
  # fails; without it the job would be skipped and report no useful conclusion.
  build-gate:
    name: build
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require test and build to have succeeded
        run: |
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"

          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build-gate failed: test=${{ needs.test.result }} build=${{ needs.build.result }}"
            exit 1
          fi

          echo "All required jobs succeeded"
