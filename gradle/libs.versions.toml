[versions]
appVersion = "v1.7.2"
compose-multiplatform = "1.9.0"
detekt = "1.23.8"
kotlin = "2.2.20"
kotlinx-coroutines = "1.10.2"
# Two ktor versions, selected by host in composeApp/build.gradle.kts. See the comment there.
ktor = "3.3.3"
ktorWindows = "3.0.1"
mordant = "3.0.2"
okio = "3.6.0"
serialization = "1.9.0"

[libraries]
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = { ref = "serialization" } }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
squareup-okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

[plugins]
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }